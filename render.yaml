services:
  - type: web
    name: saeindia-relay-server
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: RELAY_TOKEN
        value: saeindia_secret_token_2026
      - key: NODE_ENV
        value: production
      - key: KEEP_ALIVE_URL
        value: https://dronebackend-ppgp.onrender.com
      - key: RENDER_EXTERNAL_URL
        value: https://dronebackend-ppgp.onrender.com
